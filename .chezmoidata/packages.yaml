# Package lists consumed by run_onchange_before_install-packages-darwin.sh.tmpl
# and bin/executable_chezmoi-sync (package drift check).
#
# Personal Macs install "common" + "personal". Work Macs install only "work":
# they have no admin account and Homebrew lives in ~/.homebrew, where every
# formula compiles from source, so keep that list short. Editing this file
# re-runs the installer on the next `chezmoi apply`.
packages:
  darwin:
    # Fonts install on every Mac (into ~/Library/Fonts, no admin needed).
    # The installer uses --force for ones not yet installed, so it replaces
    # hand-installed copies with the same filenames.
    fonts:
      - "font-consolas-for-powerline"
      - "font-fira-code-nerd-font"
      - "font-fira-mono-for-powerline"
      - "font-iosevka-nerd-font"
      - "font-jetbrains-mono"
      - "font-jetbrains-mono-nerd-font"
      - "font-meslo-for-powerlevel10k"
      - "font-overpass"
      - "font-rubik"
    common:
      taps:
      - "homebrew/bundle"
      - "homebrew/services"
      brews:
      - "tree"
      - "ansible"
      - "apr-util"
      - "aspell"
      - "bash-completion"
      - "bat"
      - "brew-php-switcher"
      - "chezmoi"
      - "krb5"
      - "freetds"
      - "openldap"
      - "php"
      - "composer"
      - "dark-mode"
      - "dnsmasq"
      - "fzf"
      - "gh"
      - "git"
      - "glib"
      - "htop"
      - "node"
      - "http-server"
      - "icu4c@76"
      - "jq"
      - "lazygit"
      - "libfido2"
      - "lsd"
      - "lua"
      - "luarocks"
      - "mas"
      - "mkcert"
      - "mysql"
      - "ncdu"
      - "neovim"
      - "nghttp2"
      - "nginx"
      - "nss"
      - "nvm"
      - "pyenv"
      - "starship"
      - "telnet"
      - "tre-command"
      - "uv"
      - "z"
      # Installed without linking into PATH
      brews_unlinked:
        - "wp-cli"
      # Apple Silicon only: Homebrew no longer ships Intel bottles, and these
      # would compile from source. On Intel, install the release binary into
      # ~/bin by hand (see README).
      brews_arm64_only:
        - "betterleaks"
      casks:
      - "charles"
      - "cheatsheet"
      - "cyberduck"
      - "docker-desktop"
      - "figma"
      - "firefox@developer-edition"
      - "local"
      - "microsoft-auto-update"
      - "microsoft-edge"
      - "microsoft-teams"
      - "mysql-shell"
      - "mysqlworkbench"
      - "notion"
      - "obsidian"
      - "slack"
      - "tableplus"
      - "visual-studio-code"
      mas:
      - { name: "keymapp", id: 6472865291 }
      - { name: "Keynote", id: 409183694 }
      - { name: "Numbers", id: 409203825 }
      - { name: "OneDrive", id: 823766827 }
      - { name: "Pages", id: 409201541 }
      - { name: "Xcode", id: 497799835 }
    personal:
      taps: []
      brews: []
      brews_unlinked: []
      brews_arm64_only: []
      casks:
      - "claude-code"
      # Apple's installer needs admin rights, so personal Macs only
      - "font-sf-mono"
      - "discord"
      - "dropbox"
      - "pocket-casts"
      mas:
      - { name: "HP Smart", id: 1474276998 }
      - { name: "Playlisty for Apple Music", id: 1459275972 }
    work:
      taps: []
      # Homebrew in ~/.homebrew compiles every formula from source, so
      # anything added here is a long build.
      brews:
      - "bat"
      - "lsd"
      - "luarocks"
      - "ncdu"
      - "neovim"
      - "node"
      - "nvm"
      - "ripgrep"
      - "starship"
      - "tmux"
      - "tre-command"
      - "wget"
      brews_unlinked: []
      brews_arm64_only: []
      casks:
      - "1password-cli"
      - "arc"
      - "firefox@developer-edition"
      - "maccy"
      - "obsidian"
      - "raycast"
      - "visual-studio-code"
      mas: []
  # VS Code extensions (default profile). "common" installs everywhere; these
  # are per-user installs that need no admin rights and no compiling.
  vscode:
    common:
      - "bmewburn.vscode-intelephense-client"
      - "christian-kohler.path-intellisense"
      - "dbaeumer.vscode-eslint"
      - "deerawan.vscode-dash"
