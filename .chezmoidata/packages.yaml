      - "xdebug.php-debug"
      - "xdebug.php-pack"
      - "zhuangtongfa.material-theme"
      - "zignd.html-css-class-completion"
    personal:
      - "cacher.cacher-vscode"
      - "equinusocio.vsc-material-theme"
